<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Maintenance Reporting System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Hostel Maintenance Reporting System</h1>
        <p>Report hostel problems quickly and easily.</p>
    </header>

    <main>
        <section class="report-card">
            <h2>Report a Maintenance Issue</h2>

            <form id="maintenanceForm">

                <label for="studentName">Student Name</label>
                <input type="text" id="studentName" placeholder="Enter your name" required>

                <label for="roomNumber">Room Number</label>
                <input type="text" id="roomNumber" placeholder="e.g. B12" required>

                <label for="issueType">Issue Type</label>
                <select id="issueType" required>
                    <option value="">Select an issue</option>
                    <option value="Plumbing">Plumbing</option>
                    <option value="Electrical">Electrical</option>
                    <option value="Furniture">Furniture</option>
                    <option value="Internet">Internet</option>
                    <option value="Cleaning">Cleaning</option>
                    <option value="Other">Other</option>
                </select>

                <label for="description">Describe the Problem</label>
                <textarea id="description" rows="5"
                    placeholder="Explain the maintenance problem..."
                    required></textarea>

                <button type="submit">Submit Report</button>

            </form>
        </section>

        <section class="reports-card">
            <h2>Submitted Reports</h2>

            <div id="reportsList">
                <p>No reports submitted yet.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Hostel Maintenance Reporting System</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
